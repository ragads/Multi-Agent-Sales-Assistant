<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloseFuture assistant</title>
<style>
  :root{--bg:#0b1220;--panel:#111c33;--line:#1f2f4d;--ink:#e6edf7;--muted:#8fa3c0;--accent:#3b82f6}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:#060b16;color:var(--ink)}
  #cf-bubble{position:fixed;right:22px;bottom:22px;width:58px;height:58px;border-radius:50%;
    background:var(--accent);color:#fff;border:0;font-size:24px;cursor:pointer;box-shadow:0 8px 24px #0008}
  #cf-panel{position:fixed;right:22px;bottom:92px;width:380px;max-width:94vw;height:560px;max-height:78vh;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;display:none;flex-direction:column;
    overflow:hidden;box-shadow:0 20px 60px #000a}
  #cf-panel.open{display:flex}
  header{padding:12px 14px;border-bottom:1px solid var(--line);background:#0e1932}
  header b{display:block;font-size:14px} header span{font-size:12px;color:var(--muted)}
  #cf-log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .msg{padding:9px 12px;border-radius:10px;font-size:14px;line-height:1.45;max-width:86%;white-space:pre-wrap}
  .visitor{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:3px}
  .bot{align-self:flex-start;background:#18253f;border-bottom-left-radius:3px}
  .slots{display:flex;flex-direction:column;gap:6px;align-self:flex-start;max-width:86%}
  .slot{background:#132443;border:1px solid var(--accent);color:var(--ink);padding:8px 10px;border-radius:8px;
    font-size:13px;cursor:pointer;text-align:left}
  .slot:hover{background:#1a3157}
  .status{font-size:12px;color:var(--muted);align-self:center}
  footer{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px;background:#0e1932}
  input{flex:1;border:1px solid var(--line);border-radius:8px;padding:10px;color:var(--ink);
    background:#0a1528;font-size:14px}
  button.send{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:0 14px;cursor:pointer}
</style>
</head>
<body>

<button id="cf-bubble" aria-label="Chat with CloseFuture">&#128172;</button>

<div id="cf-panel" role="dialog" aria-label="CloseFuture assistant">
  <header><b>CloseFuture assistant</b><span>Ask about our work, or book a call with Baskaran</span></header>
  <div id="cf-log"></div>
  <footer>
    <input id="cf-input" placeholder="Ask something..." autocomplete="off">
    <button class="send" id="cf-send">Send</button>
  </footer>
</div>

<script>
const BASE = window.CF_API_BASE || "http://localhost:8000";
const API = BASE + "/api/chat";

// FR-2.5: one persistent visitor key across reloads and new tabs.
function visitorKey(){
  let k = localStorage.getItem("cf_visitor_key");
  if(!k){ k = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()));
          localStorage.setItem("cf_visitor_key", k); }
  return k;
}
const TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;   // FR-5.4

const log = document.getElementById("cf-log");
const input = document.getElementById("cf-input");
const panel = document.getElementById("cf-panel");

const GREETING = "Hi! I can tell you about CloseFuture's work and pricing, or book a 30-minute call with Baskaran. What would you like?";

// FR-2.5: after a reload, redraw the conversation this visitor already had instead of starting blank.
async function restoreHistory(){
  try{
    const r = await fetch(BASE + "/api/history?visitor_key=" + encodeURIComponent(visitorKey()));
    if(!r.ok) return false;
    const data = await r.json();
    (data.messages || []).forEach(m => add(m.role === "visitor" ? "visitor" : "bot", m.content));
    return (data.messages || []).length > 0;
  }catch(e){ return false; }   // history is a convenience - the chat still works without it
}

document.getElementById("cf-bubble").onclick = async () => {
  panel.classList.toggle("open");
  if(panel.classList.contains("open") && !log.dataset.greeted){
    log.dataset.greeted = "1";
    const s = status("loading your conversation...");
    const restored = await restoreHistory();
    s.remove();
    if(!restored) add("bot", GREETING);
    input.focus();
  }
};

function add(cls, text){
  const d = document.createElement("div");
  d.className = "msg " + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function status(text){
  const d = document.createElement("div"); d.className="status"; d.textContent=text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function renderSlots(slots){
  if(!slots || !slots.length) return;
  const wrap = document.createElement("div"); wrap.className = "slots";
  slots.forEach((s,i) => {
    const b = document.createElement("button");
    b.className = "slot"; b.textContent = (i+1) + ".  " + (s.visitor_label || s.start_iso);
    b.onclick = () => { send("I'll take option " + (i+1) + " - " + (s.visitor_label||s.start_iso)); };
    wrap.appendChild(b);
  });
  log.appendChild(wrap); log.scrollTop = log.scrollHeight;
}

let busy = false;
async function send(text){
  if(busy || !text.trim()) return;
  busy = true; add("visitor", text); input.value = "";
  const s = status("thinking...");
  try{
    const r = await fetch(API, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({visitor_key: visitorKey(), message: text, visitor_tz: TZ})
    });
    if(!r.ok) throw new Error("HTTP " + r.status);
    const data = await r.json();
    s.remove();
    add("bot", data.reply);
    renderSlots(data.slots);
  }catch(e){
    s.remove();
    add("bot","I couldn't reach our assistant just now. Please try again in a moment, or email baskaran@closefuture.io.");
  }finally{ busy = false; input.focus(); }
}

document.getElementById("cf-send").onclick = () => send(input.value);
input.addEventListener("keydown", e => { if(e.key === "Enter") send(input.value); });
</script>
</body>
</html>
